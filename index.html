<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sponge Counter by matswuuu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="images/sponge.webp" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo">Губка-считатель</span>
        <span class="topbar-author">
          by <a href="https://matswuuu.dev" target="_blank" rel="noopener">matswuuu</a>
        </span>
      </div>
      <nav class="mode-switcher">
        <button class="mode-btn active" data-mode="level" onclick="switchMode('level')">По уровню</button>
        <button class="mode-btn" data-mode="sponges" onclick="switchMode('sponges')">По губкам</button>
        <a href="island-calculator.html" class="mode-btn">Остров</a>
      </nav>
    </header>

    <section class="settings card">
      <legend><strong>Настройки</strong></legend>
      <label>
        <img class="block-icon" src="images/sponge.png" alt=""> XP уровней за губку:
        <input id="xpLevelsInput" type="number" min="32" />
      </label>
      <label>
        <img class="block-icon" src="images/sponge.png" alt=""> Цена за губку:
        <input id="moneyInput" type="number" min="0" />
      </label>
      <label>
        <img class="block-icon" src="images/sponge.png" alt=""> Уровень острова за губку:
        <input id="islandInput" type="number" min="0" />
      </label>
    </section>

    <section class="allStatics card">
      <legend><strong>Общая статистика</strong></legend>
      <p id="all">
        Количество: 0. Сумма: 0. Уровень острова: 0<br />
        Двойных сундуков: 0, шалкеров: 0, стаков: 0, остаток: 0
      </p>
    </section>

    <section id="box" class="card"></section>

    <div class="button-row">
      <button class="addInputButton" onclick="addInput()">Добавить поле</button>
    </div>
  </body>
</html>
