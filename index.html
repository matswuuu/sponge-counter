<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Sponge Counter by matswuuu</title>
    <link href="style.css" rel="stylesheet" />
    <script src="index.js" defer></script>
    <style></style>

  <body>
    <h1>Подсчитыватель губок by matswuuu</h1>

    <div id="inputsContainer" class="inputs">
      <input type="text" name="input" placeholder="Уровень" />
    </div>

    <iframe
      src="https://discord.com/widget?id=1068804692903206952&theme=dark"

      height="300"
      allowtransparency="true"
      frameborder="0"
      sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
    ></iframe>

    <div>
      <button onclick="count()" id="countButton">Подсчитать</button>
    </div>
  </body>
  <footer>
