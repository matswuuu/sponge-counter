<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compressed Calculator — Sponge Counter by matswuuu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="compressed-calculator.css" rel="stylesheet" />
    <link rel="icon" href="images/sponge.webp" />
    <script src="compressed-calculator.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <a href="index.html" style="text-decoration: none; color: inherit;">
          <span class="topbar-logo">Губка-считатель</span>
        </a>
        <span class="topbar-author">
          by <a href="https://matswuuu.dev" target="_blank" rel="noopener">matswuuu</a>
        </span>
      </div>
      <nav class="mode-switcher">
        <a href="index.html" class="mode-btn">Губки</a>
        <a href="island-calculator.html" class="mode-btn">Остров</a>
        <span class="mode-btn active">Сжатие</span>
      </nav>
    </header>

    <section class="card">
      <legend><strong>Калькулятор сжатых предметов</strong></legend>
      <p>Сколько обычных предметов нужно для крафта сжатых предметов</p>
      <div class="input-row">
        <label>
          Я хочу получить:
          <input id="countInput" type="number" min="1" value="1" />
        </label>
        <label>
          <select id="tierSelect"></select>
        </label>
      </div>
    </section>

    <section class="card">
      <legend><strong>Результат</strong></legend>
      <table class="results-table">
        <thead>
          <tr>
            <th>Тир</th>
            <th>Количество</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </section>
  </body>
</html>
